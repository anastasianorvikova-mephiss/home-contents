<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QIC — About property</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/flow.css">
</head>
<body class="flow">

  <!-- ======================= Header-flow-v1.1 ======================= -->
  <header class="flow-header">
    <a class="flow-header__logo" href="index.html" aria-label="QIC">
      <img src="assets/img/logo.svg" alt="" width="76" height="24">
    </a>

    <nav class="flow-steps" aria-label="Quote progress">
      <!-- The mobile header swaps the per-step labels for one caption -->
      <p class="text-small-medium flow-steps__caption">Step 1 of 3: Property</p>

      <ol class="flow-progress">
        <li class="flow-progress__step is-active" aria-current="step">
          <span class="text-small-medium flow-progress__label">Property</span>
          <span class="flow-progress__bar"></span>
        </li>
        <li class="flow-progress__step">
          <span class="text-small-medium flow-progress__label">Coverage</span>
          <span class="flow-progress__bar"></span>
        </li>
        <li class="flow-progress__step">
          <span class="text-small-medium flow-progress__label">Quote</span>
          <span class="flow-progress__bar"></span>
        </li>
      </ol>
    </nav>
  </header>

  <!-- ================ Loading skeleton — frame 35670:120340 ================ -->
  <div class="flow-content flow-skeleton" data-skeleton aria-hidden="true">
    <div class="flow-card skeleton-card skeleton-card--form">
      <div class="skeleton-lines">
        <span class="skeleton skeleton--line"></span>
        <span class="skeleton skeleton--line skeleton--line-short"></span>
      </div>
      <div class="skeleton-row">
        <span class="skeleton skeleton--box"></span>
        <span class="skeleton skeleton--box"></span>
      </div>
    </div>

    <div class="flow-card skeleton-card skeleton-card--summary">
      <div class="skeleton-lines">
        <span class="skeleton skeleton--line"></span>
        <span class="skeleton skeleton--line skeleton--line-summary"></span>
      </div>
      <div class="skeleton-stack">
        <span class="skeleton skeleton--tile"></span>
        <span class="skeleton skeleton--tile"></span>
      </div>
    </div>
  </div>

  <main class="flow-content" data-step-content hidden>

    <!-- ========================= About property ========================= -->
    <form class="flow-card flow-card--form" id="property-form" action="#" novalidate>
      <h1 class="heading-2">About property</h1>

      <div class="flow-fields">

        <div class="field">
          <div class="field__body">
            <div class="field__content">
              <label class="field__label" for="address">Address and city</label>
              <input class="field__input" id="address" type="text" placeholder=" " autocomplete="street-address">
            </div>
          </div>
          <p class="text-small-regular field__caption">Example: Apartment 1, Building 2, Street 3, Zone 4, Doha</p>
        </div>

        <div class="flow-fields__row">
          <div class="flow-fields__col">
            <div class="field field--filled">
              <div class="field__body">
                <div class="field__content">
                  <label class="field__label" for="contents-value">Home contents value, QAR</label>
                  <input class="field__input" id="contents-value" type="text" inputmode="numeric"
                         placeholder=" " value="50,000" data-contents-value>
                </div>
              </div>
            </div>
            <a class="link" href="#">
              How do I understand the price
              <img class="link__icon" src="assets/img/icon-info.svg" alt="" width="16" height="16">
            </a>
          </div>

          <div class="field field--filled field--date">
            <div class="field__body">
              <div class="field__content">
                <label class="field__label" for="start-date">Policy start date</label>
                <span class="field__input field__input--static" data-start-date-text>&nbsp;</span>
              </div>
              <img class="field__icon" src="assets/img/icon-calendar-24.svg" alt="" width="24" height="24">
              <!-- The native control drives the value but is invisible: it renders
                   the date in its own locale format, which is not the design's -->
              <input class="field__date" id="start-date" type="date" data-start-date>
            </div>
            <p class="text-small-regular field__caption">Valid until <span data-valid-until></span></p>
          </div>
        </div>

      </div>
    </form>

    <!-- ============================= Summary ============================= -->
    <aside class="flow-card summary">
      <h2 class="heading-5">Home contents insurance</h2>

      <div class="summary__list">
        <div class="summary__cell">
          <span class="text-medium summary__key">Policy dates</span>
          <span class="text-medium summary__value" data-policy-dates></span>
        </div>
      </div>

      <hr class="summary__line">

      <div class="summary__cell summary__cell--total">
        <div class="summary__total">
          <span class="heading-6">Total price</span>
          <a class="link summary__covered" href="index.html#covers">What&rsquo;s covered</a>
        </div>
        <span class="heading-6 summary__price">QAR 1,420</span>
      </div>

      <button class="btn btn--l btn--primary btn--block" type="submit" form="property-form">
        <span class="btn__content">Continue</span>
        <img class="btn__icon" src="assets/img/icon-arrow-right-24.svg" alt="" width="24" height="24">
      </button>
    </aside>

  </main>

  <!-- ======================== Flow footer v.1.0 ======================== -->
  <footer class="flow-footer">
    <a class="flow-footer__link" href="#">
      <img src="assets/img/icon-support-24.svg" alt="" width="24" height="24">
      <span class="text-medium">Need help? Contact us</span>
    </a>
  </footer>

  <script src="js/state.js"></script>
  <script src="js/flow.js"></script>
</body>
</html>
